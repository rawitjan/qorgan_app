<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QORGAN design QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #d9d9d4; color: #101010; font: 700 12px/1.2 Arial, sans-serif; }
      header { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid #101010; background: #c7ff18; text-transform: uppercase; letter-spacing: .08em; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
      section { min-width: 0; background: white; border: 2px solid #101010; overflow: hidden; }
      h2 { height: 32px; margin: 0; padding: 9px 10px 0; border-bottom: 2px solid #101010; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
      .reference { display: block; width: 100%; height: 720px; object-fit: contain; object-position: top center; background: #fff; }
      .frame { position: relative; height: 720px; overflow: hidden; background: #fff; }
      iframe { width: 1100px; height: 1440px; border: 0; transform: scale(.49); transform-origin: top left; }
    </style>
  </head>
  <body>
    <header><span>QORGAN / visual fidelity check</span><span>reference + rendered implementation</span></header>
    <main>
      <section><h2>01 / Selected visual target</h2><img class="reference" src="/design-qa-reference.png" alt="Selected threat laboratory design" /></section>
      <section><h2>02 / Browser-rendered implementation</h2><div class="frame"><iframe id="implementation" src="/" title="QORGAN implementation"></iframe></div></section>
    </main>
    <script>
      const frame = document.getElementById('implementation');
      frame.addEventListener('load', () => {
        const timer = setInterval(() => {
          const buttons = [...frame.contentDocument.querySelectorAll('button')];
          const start = buttons.find((button) => /ТЕРГЕУДІ БАСТАУ|НАЧАТЬ РАССЛЕДОВАНИЕ/.test(button.textContent));
          if (start) { start.click(); clearInterval(timer); }
        }, 100);
        setTimeout(() => clearInterval(timer), 5000);
      });
    </script>
  </body>
</html>
